apiVersion: apps/v1
kind: Deployment
metadata:
  name: mn-grpc-client
  labels:
    app: mn-grpc-client
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mn-grpc-client
  template:
    metadata:
      labels:
        app: mn-grpc-client
    spec:
      containers:
        - name: mn-grpc-client
          image: mikew01/mn-grpc-client:v1.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8099 # REST API port
          env:
            - name: GRPC_SERVER_HOST
              value: sb-grpc-server
            - name: REST_SERVER_HOST
              value: 0.0.0.0