apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mn-grpc-client
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mn-grpc-client
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /prometheus
      interval: 15s